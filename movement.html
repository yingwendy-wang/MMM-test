<!doctype html>
<html>

<head>
  <title>Multi Modal Mobility</title>
  <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/frame.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/controls.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/widgets.css" media="screen" rel="stylesheet" type="text/css" />
  <link href="css/custom.css" media="screen" rel="stylesheet" type="text/css" />
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300,700' rel='stylesheet' type='text/css'>
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/util.js"></script>
  <script src="js/custom.js"></script>
  <style>
    .menu-movement {
      color: rgb(255, 255, 255) !important;
      opacity: 1 !important;
      font-weight: 700 !important;
    }
  </style>
</head>

<body class="force-no-scroll">
    <div class="menu-container"></div>

    <div class="regions-nav">
    <ul class="nav">
      <li class="active" data-iframe="dynamic"><a>Dynamic</a></li>
      <li data-iframe="static"><a>Static</a></li>
    </ul>
  </div>

  <div class="iframe-container">
    <div id="dynamic-frame" class="iframe-wrapper" style="display: block;">
      <div class="loading">
        <div class="spinner"></div>
        Loading Dynamic Map...
      </div>
      <iframe class="iframe" id="dynamic-iframe" data-src="file/flowmap_dynamic.htm" style="display: none;"></iframe>
    </div>
    
    <div id="static-frame" class="iframe-wrapper" style="display: none;">
      <div class="loading">
        <div class="spinner"></div>
        Loading Static Map...
      </div>
      <iframe class="iframe" id="static-iframe" data-src="file/flowmap_static.htm" style="display: none;"></iframe>
    </div>
  </div>
  
    <style>
        .regions-nav {
            position: absolute;
            width: 100%;
            z-index: 888;
            top: 10rem;
        }

        .regions-nav ul.nav {
            text-align: center;
        }

        .regions-nav li {
            display: inline-block;
            float: none;
            margin: 0 8px;
        }

        .regions-nav li a {
            background: rgba(51, 51, 51,.60);
            border-radius: 100px;
            color: #fff;
            cursor: pointer;
            padding: 10px 20px;
            font-weight: bold;
        }

        .regions-nav li.active > a, .regions-nav li a:hover {
            background: #0bb1bf;
        }

    </style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      const tabItems = document.querySelectorAll('.regions-nav li');
      const iframeWrappers = document.querySelectorAll('.iframe-wrapper');
      const loadedMaps = { dynamic: false, static: false };
      
      // Function to show a specific iframe
      function showIframe(iframeType) {
        // Hide all iframes
        iframeWrappers.forEach(wrapper => {
          wrapper.style.display = 'none';
        });
        
        // Show selected iframe
        document.getElementById(`${iframeType}-frame`).style.display = 'block';
        
        // Load iframe if not already loaded
        if (!loadedMaps[iframeType]) {
          const iframe = document.getElementById(`${iframeType}-iframe`);
          const loadingElement = iframe.previousElementSibling;
          
          // Show loading indicator
          loadingElement.style.display = 'block';
          
          // Set iframe source
          iframe.src = iframe.getAttribute('data-src');
          
          // When iframe loads, hide loading indicator
          iframe.onload = function() {
            loadingElement.style.display = 'none';
            iframe.style.display = 'block';
            loadedMaps[iframeType] = true;
            
            // Trigger resize event to ensure proper map rendering
            setTimeout(() => {
              try {
                iframe.contentWindow.dispatchEvent(new Event('resize'));
              } catch (e) {
                console.log('Could not trigger resize in iframe:', e);
              }
            }, 500);
          };
        }
        
        // Update active tab
        tabItems.forEach(item => {
          item.classList.remove('active');
          if (item.getAttribute('data-iframe') === iframeType) {
            item.classList.add('active');
          }
        });
      }
      
      // Add click event to tabs
      tabItems.forEach(item => {
        item.addEventListener('click', function() {
          const iframeType = this.getAttribute('data-iframe');
          showIframe(iframeType);
        });
      });
      
      // Load the initial iframe (dynamic)
      showIframe('dynamic');
    });
  </script>
</body>
</body>

</html>
