<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced 4-Layer Map Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            text-align: center;
            position: relative;
        }
        
        header {
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .description {
            max-width: 800px;
            margin: 0 auto;
            color: #b8b8d1;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .layers-wrapper {
            display: flex;
            width: 100%;
            position: relative;
            margin-bottom: 80px; /* Added space at the bottom */
        }
        
        .layers-container {
            width: 90%;
            height: 600px;
            position: relative;
            margin: 20px auto;
            perspective: 2000px;
        }
        
        .sidebar {
            width: 15%;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            transition: opacity 0.5s ease;
        }
        
        .sidebar-item {
            padding: 15px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: default;
            transition: all 0.3s ease;
        }
        
        .sidebar-item.movement {
            background: linear-gradient(45deg, rgba(233, 69, 96, 0.3), rgba(233, 69, 96, 0.1));
            color: #e94560;
            border-left: 3px solid #e94560;
            margin-top: 50px;
        }
        
        .sidebar-item.behavior {
            background: linear-gradient(45deg, rgba(0, 199, 139, 0.3), rgba(0, 199, 139, 0.1));
            color: #00c78b;
            border-left: 3px solid #00c78b;
            margin-top: 100px;
        }
        
        .sidebar-item.sensory {
            background: linear-gradient(45deg, rgba(97, 144, 232, 0.3), rgba(97, 144, 232, 0.1));
            color: #6190e8;
            border-left: 3px solid #6190e8;
            margin-top: 100px;
        }
        
        .sidebar-item.emotion {
            background: linear-gradient(45deg, rgba(255, 184, 0, 0.3), rgba(255, 184, 0, 0.1));
            color: #ffb800;
            border-left: 3px solid #ffb800;
            margin-top: 120px;
        }
        
        .map-layer {
            position: absolute;
            width: 90%;
            height: 450px;
            left: 3%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.8s ease;
            transform-origin: center;
            cursor: pointer;
        }
        
        .map-content {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .map-title {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
        }
        
        .mini-map {
            width: 100%;
            height: 100%;
        }
        
        .movement-layer {
            background: linear-gradient(45deg, rgba(233, 69, 96, 0.7), rgba(233, 69, 96, 0.4));
            border: 2px solid #e94560;
            transform: rotateX(60deg) translateZ(110px) translateY(00px);
            z-index: 4;
        }
        
        .behavior-layer {
            background: linear-gradient(45deg, rgba(0, 199, 139, 0.7), rgba(0, 199, 139, 0.4));
            border: 2px solid #00c78b;
            transform: rotateX(60deg) translateZ(-50px) translateY(50px);
            z-index: 3;
        }
        
        .sensory-layer {
            background: linear-gradient(45deg, rgba(97, 144, 232, 0.7), rgba(97, 144, 232, 0.4));
            border: 2px solid #6190e8;
            transform: rotateX(60deg) translateZ(-240px) translateY(120px);
            z-index: 2;
        }
        
        .emotion-layer {
            background: linear-gradient(45deg, rgba(255, 184, 0, 0.7), rgba(255, 184, 0, 0.4));
            border: 2px solid #ffb800;
            transform: rotateX(60deg) translateZ(-400px) translateY(260px);
            z-index: 1;
        }
        
        .map-layer.active {
            transform: rotateX(0deg) translateZ(250px) !important;
            z-index: 10;
            cursor: auto;
            width: 100%;
            height: 100%;
            left: 0;
            border-radius: 0;
        }
        
        .map-layer.active ~ .sidebar {
            opacity: 0;
            pointer-events: none;
        }
        
        .instructions {
            margin-top: 30px;
            padding: 15px;
            background: rgba(22, 33, 62, 0.8);
            border-radius: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .instructions p {
            color: #b8b8d1;
            margin-bottom: 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #b8b8d1;
        }
        
        @media (max-width: 768px) {
            .layers-container {
                height: 500px;
            }
            
            .map-layer {
                height: 250px;
                width: 85%;
                left: 7.5%;
            }
            
            .map-layer.active {
                height: 100%;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            /* Adjust spacing for mobile */
            .behavior-layer {
                transform: rotateX(60deg) translateZ(-100px) translateY(58px);
            }
            
            .sensory-layer {
                transform: rotateX(60deg) translateZ(-200px) translateY(116px);
            }
            
            .emotion-layer {
                transform: rotateX(60deg) translateZ(-300px) translateY(173px);
            }
            
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

        const flows = [{from: 300, to: 296, count: 130}, {from: 873, to: 946, count: 83}, {from: 296, to: 300, count: 72}, {from: 296, to: 598, count: 68}, {from: 598, to: 296, count: 67}, {from: 946, to: 873, count: 50}, {from: 946, to: 296, count: 44}, {from: 451, to: 885, count: 44}, {from: 580, to: 451, count: 43}, {from: 885, to: 451, count: 41}, {from: 944, to: 296, count: 41}, {from: 580, to: 579, count: 40}, {from: 451, to: 629, count: 40}, {from: 579, to: 451, count: 35}, {from: 296, to: 946, count: 34}, {from: 180, to: 296, count: 34}, {from: 629, to: 451, count: 33}, {from: 451, to: 579, count: 31}, {from: 451, to: 296, count: 31}, {from: 579, to: 580, count: 30}, {from: 296, to: 180, count: 29}, {from: 300, to: 913, count: 29}, {from: 451, to: 580, count: 29}, {from: 579, to: 885, count: 28}, {from: 296, to: 944, count: 27}, {from: 300, to: 944, count: 26}, {from: 946, to: 872, count: 26}, {from: 296, to: 451, count: 25}, {from: 296, to: 101, count: 25}, {from: 872, to: 946, count: 24}, {from: 300, to: 907, count: 21}, {from: 580, to: 296, count: 21}, {from: 584, to: 885, count: 21}, {from: 296, to: 873, count: 21}, {from: 946, to: 944, count: 21}, {from: 944, to: 300, count: 21}, {from: 451, to: 584, count: 20}];

        // Function to get color based on sentiment score
        function getSentimentColor(score) {
            // Interpolate between red (negative), yellow (neutral), and green (positive)
            if (score < 0) {
                return `rgb(255, ${Math.round(255 * (1 + score))}, 0)`;
            } else {
                return `rgb(${Math.round(255 * (1 - score))}, 255, 0)`;
            }
        }

        // Function to create a gradient line between two points
        function createGradientLine(fromLoc, toLoc, fromScore, toScore, count, layer) {
            // Create a line with intermediate points for gradient effect
            const latDiff = toLoc.lat - fromLoc.lat;
            const lngDiff = toLoc.lng - fromLoc.lng;
            
            // Create segments for gradient effect
            const segments = 20;
            let points = [];
            
            for (let i = 0; i <= segments; i++) {
                const ratio = i / segments;
                const lat = fromLoc.lat + (latDiff * ratio);
                const lng = fromLoc.lng + (lngDiff * ratio);
                points.push([lat, lng]);
            }
            
            // Create a multi-segment line with gradient colors
            for (let i = 0; i < segments; i++) {
                const ratio1 = i / segments;
                const ratio2 = (i + 1) / segments;
                
                // Calculate intermediate sentiment score
                const score = fromScore + (toScore - fromScore) * ratio1;
                
                // Create line segment
                const segment = L.polyline([points[i], points[i+1]], {
                    color: getSentimentColor(score),
                    weight: count/8,
                    opacity: 1
                });
                
                layer.addLayer(segment);
            }
        }

        // Initialize maps for each layer with CartoDB light tiles
        function initMap(elementId, color) {

                scrollWheelZoom: false
            }).setView([22.35, 114.1], 11);
            
            // Use CartoDB light tiles instead of OpenStreetMap
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {

            return {
                map: map,
                originalCenter: [22.35, 114.1],
                originalZoom: 11
            };
        }

        // Initialize movement map with custom visualization
        function initMovementMap(elementId) {
            const map = L.map(elementId, {
                zoomControl: false,
                attributionControl: true,
                dragging: false,
                scrollWheelZoom: false
            }).setView([22.35, 114.1], 11);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {

            }).addTo(map);
            
            // Add circle markers for locations (default color, size based on visits)
            locations.forEach(location => {
                L.circleMarker([location.lat, location.lng], {
                    color: '#3388ff',
                    weight: 1,
                    fillOpacity: 1,
                    radius: Math.max(5, location.totalVisits/500)
                }).addTo(map);
            });
            
            // Add straight lines for movement (default color, width based on count)
            flows.forEach(flow => {
                const fromLocation = locations.find(loc => loc.id === flow.from);
                const toLocation = locations.find(loc => loc.id === flow.to);
                
                if (fromLocation && toLocation) {
                    L.polyline([
                        [fromLocation.lat, fromLocation.lng],
                        [toLocation.lat, toLocation.lng]
                    ], {
                        color: '#3388ff',
                        weight: flow.count/8,
                        opacity: 0.8
                    }).addTo(map);
                }
            });
            
            return {
                map: map,
                originalCenter: [22.35, 114.1],
                originalZoom: 11
            };
        }

        // Initialize emotion map with custom visualization
        function initEmotionMap(elementId) {
            const map = L.map(elementId, {
                zoomControl: false,
                attributionControl: true,
                dragging: false,
                scrollWheelZoom: false
            }).setView([22.35, 114.1], 11);
            
            // Use CartoDB light tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);
            
            // Add circle markers for locations (color based on sentiment, size based on visits)
            locations.forEach(location => {
                L.circleMarker([location.lat, location.lng], {
                    color: getSentimentColor(location.sentimentScore),
                    weight: 2,
                    fillColor: getSentimentColor(location.sentimentScore),
                    fillOpacity: 1,
                    radius: Math.max(5, location.totalVisits/500)
                }).addTo(map);
            });
            
            // Add gradient lines for sentiment movement
            flows.forEach(flow => {
                const fromLocation = locations.find(loc => loc.id === flow.from);
                const toLocation = locations.find(loc => loc.id === flow.to);
                
                if (fromLocation && toLocation) {
                    createGradientLine(
                        fromLocation, 
                        toLocation, 
                        fromLocation.sentimentScore, 
                        toLocation.sentimentScore,
                        flow.count,
                        map
                    );
                }
            });
            
            return {
                map: map,
                originalCenter: [22.35, 114.1],
                originalZoom: 11
            };
        }
        
        // Initialize all maps
        const movementData = initMovementMap('movement-map');
        const behaviorData = initMap('behavior-map', '#00c78b');
        const sensoryData = initMap('sensory-map', '#6190e8');
        const emotionData = initEmotionMap('emotion-map');

        const emotionMap = emotionData.map;
        
        // Layer control functionality
        const layersContainer = document.getElementById('layers-container');
        const layers = document.querySelectorAll('.map-layer');
        
        // Store map instances for interaction control
        const mapInstances = {
            'movement-map': movementData,
            'behavior-map': behaviorData,
            'sensory-map': sensoryData,
            'emotion-map': emotionData
        };
        
        // Store zoom controls to prevent duplicates
        const zoomControls = {
            'movement-map': null,
            'behavior-map': null,
            'sensory-map': null,
            'emotion-map': null
        };
        
        // Store original transforms for each layer
        const originalTransforms = {
            'movement-layer': 'rotateX(60deg) translateZ(110px) translateY(00px)',
            'behavior-layer': 'rotateX(60deg) translateZ(-50px) translateY(50px)',
            'sensory-layer': 'rotateX(60deg) translateZ(-240px) translateY(120px)',
            'emotion-layer': 'rotateX(60deg) translateZ(-400px) translateY(260px)'
        };
        
        // Function to reset a map to its original view
        function resetMapView(mapData) {
            mapData.map.setView(mapData.originalCenter, mapData.originalZoom);
        }
        
        // Function to activate a layer
        function activateLayer(layer) {
            // Deactivate all layers first
            layers.forEach(l => {
                l.classList.remove('active');
                
                // Disable map interaction
                const mapId = l.id.replace('-layer', '-map');
                const mapData = mapInstances[mapId];
                if (mapData) {
                    mapData.map.dragging.disable();
                    mapData.map.scrollWheelZoom.disable();
                    mapData.map.touchZoom.disable();
                    mapData.map.doubleClickZoom.disable();
                    mapData.map.boxZoom.disable();
                    mapData.map.keyboard.disable();
                    
                    // Remove zoom control if it exists
                    if (zoomControls[mapId]) {
                        mapData.map.removeControl(zoomControls[mapId]);
                        zoomControls[mapId] = null;
                    }
                    
                    // Reset the transform to original
                    l.style.transform = originalTransforms[l.id];
                }
            });
            
            // Activate the selected layer
            layer.classList.add('active');
            
            // Enable map interaction for active layer
            const mapId = layer.id.replace('-layer', '-map');
            const mapData = mapInstances[mapId];
            if (mapData) {
                // Wait for the transition to complete before enabling interactions
                setTimeout(() => {
                    mapData.map.dragging.enable();
                    mapData.map.scrollWheelZoom.enable();
                    mapData.map.touchZoom.enable();
                    mapData.map.doubleClickZoom.enable();
                    mapData.map.boxZoom.enable();
                    mapData.map.keyboard.enable();
                    
                    // Update map size to fit container
                    mapData.map.invalidateSize();
                    
                    // Add zoom control if not already added
                    if (!zoomControls[mapId]) {
                        zoomControls[mapId] = L.control.zoom({
                            position: 'topright'
                        }).addTo(mapData.map);
                    }
                }, 800); // Match the CSS transition duration
            }
        }
        
        // Function to deactivate all layers
        function deactivateAllLayers() {
            layers.forEach(l => {
                l.classList.remove('active');
                
                // Disable map interaction and reset view
                const mapId = l.id.replace('-layer', '-map');
                const mapData = mapInstances[mapId];
                if (mapData) {
                    mapData.map.dragging.disable();
                    mapData.map.scrollWheelZoom.disable();
                    mapData.map.touchZoom.disable();
                    mapData.map.doubleClickZoom.disable();
                    mapData.map.boxZoom.disable();
                    mapData.map.keyboard.disable();
                    
                    // Remove zoom control if it exists
                    if (zoomControls[mapId]) {
                        mapData.map.removeControl(zoomControls[mapId]);
                        zoomControls[mapId] = null;
                    }
                    
                    // Reset map to original view
                    resetMapView(mapData);
                    
                    // Reset the transform to original
                    l.style.transform = originalTransforms[l.id];
                }
            });
        }
        
        // Add click event to map layers
        layers.forEach(layer => {
            layer.addEventListener('click', (e) => {
                e.stopPropagation();
                activateLayer(layer);
            });
        });
        
        // Add click event to container to deactivate layers when clicking outside
        layersContainer.addEventListener('click', (e) => {
            if (e.target === layersContainer) {
                deactivateAllLayers();
            }
        });
        
        // Add click event to document to deactivate layers when clicking outside
        document.addEventListener('click', (e) => {
            let isMapLayer = false;
            let el = e.target;
            
            // Check if the clicked element is inside a map layer
            while (el && el !== document.body) {
                if (el.classList && el.classList.contains('map-layer')) {
                    isMapLayer = true;
                    break;
                }
                el = el.parentNode;
            }
            
            if (!isMapLayer) {
                deactivateAllLayers();
            }
        });
    </script>
</body>
</html>
